name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: "zulu"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        run: |
          mkdir -p .sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path .sonar/scanner

      # begin and end must run from the repo root; do not cd in those steps.
      - name: Begin SonarQube analysis
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN secret is not set" >&2
            exit 1
          fi
          if [ -z "${SONAR_HOST_URL}" ]; then
            echo "SONAR_HOST_URL secret or variable is not set" >&2
            exit 1
          fi
          .sonar/scanner/dotnet-sonarscanner begin \
            /k:"PcBuilder" \
            /n:"PcBuilder" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="${SONAR_HOST_URL}" \
            /d:sonar.projectBaseDir="${{ github.workspace }}" \
            /d:sonar.javascript.lcov.reportPaths="${{ github.workspace }}/Frontend/coverage/lcov.info" \
            /d:sonar.exclusions="**/.grok/**,**/node_modules/**,**/.sonarqube/**,**/bin/**,**/obj/**,**/wwwroot/**" \
            /d:sonar.coverage.exclusions="**/*.test.ts,**/*.test.tsx,**/test/**,**/main.tsx"

      - name: Build backend
        run: dotnet build Backend/PcBuilderBackend.sln

      - name: Frontend tests with coverage
        working-directory: Frontend
        run: |
          npm ci
          npm run test:coverage

      - name: End SonarQube analysis
        run: |
          set -euo pipefail
          config="${{ github.workspace }}/.sonarqube/conf/SonarQubeAnalysisConfig.xml"
          if [ ! -f "${config}" ]; then
            echo "SonarQube begin did not create ${config}" >&2
            exit 1
          fi
          .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
