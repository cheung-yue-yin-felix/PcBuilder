<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PC Builder</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: #0f1419;
            color: #e7ecf3;
        }
        main {
            max-width: 36rem;
            padding: 2rem;
            border: 1px solid #243044;
            border-radius: 1rem;
            background: #171e29;
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
        p { margin: 0 0 1rem; line-height: 1.5; color: #b7c2d0; }
        a { color: #7dd3fc; }
        code { font-family: ui-monospace, SFMono-Regular, monospace; color: #f8fafc; }
    </style>
</head>
<body>
    <main>
        <h1>PC Builder</h1>
        <p>This is a placeholder for the React SPA. Static files are served from this API host.</p>
        <p>API docs: <a href="/scalar">Scalar</a> &middot; OpenAPI: <a href="/openapi/v1.json"><code>/openapi/v1.json</code></a></p>
        <p>Auth: <code>POST /api/auth/register</code>, <code>POST /api/auth/login</code>, <code>GET /api/auth/me</code></p>
    </main>
</body>
</html>
